{% extends "base.html" %}

{% block page_title %}
  Excluir - Tarefa
{% endblock page_title %}

{% block content %}
  <div class="confirm-wrap">
    <div class="card shadow text-center confirm-card">
      <div class="card-body p-4 p-md-5">
        <span class="confirm-icon"><i class="bi bi-trash3-fill" aria-hidden="true"></i></span>
        <h1 class="h4 card-title">Excluir Tarefa</h1>
        <p class="card-text">Tem certeza que deseja excluir a tarefa "<strong>{{ object.title }}</strong>"?</p>
        <p class="confirm-warning">Esta ação não poderá ser desfeita.</p>

        <form method="POST" class="d-flex justify-content-center gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sim, excluir</button>
          <a href="{% url 'todo_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
{% endblock content %}
