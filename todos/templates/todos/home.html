<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre — Front-end & Data Science</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fcfbf9; /* Tom papel / creme */
            color: #1c1917;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e7e5e4;
            padding: 48px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .greeting {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #78716c;
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Newsreader', serif;
            font-weight: 400;
            font-size: 2.5rem;
            line-height: 1.2;
            color: #0c0a09;
            margin-bottom: 24px;
        }

        h1 em {
            font-style: italic;
            color: #d97706; /* Detalhe em âmbar */
        }

        .bio {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #44403c;
            margin-bottom: 32px;
        }

        .bio strong {
            color: #1c1917;
            font-weight: 600;
        }

        .skills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .skill-tag {
            font-size: 0.8rem;
            background: #f5f5f4;
            color: #57534e;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
        }

        .links {
            display: flex;
            gap: 16px;
            border-top: 1px solid #f5f5f4;
            padding-top: 24px;
        }

        .link-btn {
            font-size: 0.95rem;
            color: #1c1917;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .link-btn:hover {
            opacity: 0.6;
        }

        .link-btn span {
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <main class="card">
        <p class="greeting">Portfólio Pessoal</p>
        
        <h1>Bem-vindo. <em>Enchanté!</em></h1>
        
        <p class="bio">
            Me chamo <strong>Alexandre</strong>. Sou estudante, atualmente estagiando como <strong>Desenvolvedor Front-end</strong> e me preparando para ser um futuro <strong>Cientista de Dados</strong>.
        </p>

        <div class="skills">
            <span class="skill-tag">Front-end</span>
            <span class="skill-tag">Data Science</span>
            <span class="skill-tag">Estudos</span>
        </div>

        <nav class="links">
            <a href="https://www.linkedin.com/in/alexandrelimaandre/" target="_blank" class="link-btn">LinkedIn <span>↗</span></a>
            <a href="https://github.com/Alexlimaandre" target="_blank" class="link-btn">GitHub <span>↗</span></a>
        </nav>
    </main>

</body>
</html>
