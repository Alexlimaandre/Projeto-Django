{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <script src="{% static 'js/theme.js' %}"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 48px 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 3px solid var(--gold);
        }

        .greeting {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold-text);
            font-weight: 600;
            margin-bottom: 12px;
        }

        h1 {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: 2.5rem;
            line-height: 1.2;
            color: var(--text);
            margin-bottom: 24px;
        }

        h1 em {
            font-style: italic;
            color: var(--accent-text);
        }

        .bio {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .bio strong {
            color: var(--text);
            font-weight: 600;
        }

        .skills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .skill-tag {
            font-size: 0.8rem;
            background: var(--bg-2);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
        }

        .links {
            display: flex;
            gap: 16px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .link-btn {
            font-size: 0.95rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .link-btn:hover {
            color: var(--accent-text);
        }

        .link-btn:focus-visible,
        .todo-btn:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
            border-radius: 6px;
        }

        .link-btn span {
            font-size: 0.8rem;
        }
        .todo-btn {
            width: 100%;
            margin-top: 28px;
            padding: 14px 20px;
            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            background: var(--accent);
            color: #ffffff;

            border: 1px solid var(--accent);
            border-radius: 8px;

            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .todo-btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 30, 36, 0.25);
        }

        .todo-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .todo-btn span {
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .todo-btn:hover span {
            transform: translateX(3px);
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <button type="button" class="theme-toggle theme-toggle--floating" aria-label="Alternar entre tema claro e escuro">
        <i class="bi bi-moon-stars-fill icon-moon" aria-hidden="true"></i>
        <i class="bi bi-sun-fill icon-sun" aria-hidden="true"></i>
    </button>

    <main class="card">
        <p class="greeting">Portfólio Pessoal</p>

        <h1>Bem-vindo. <em>Enchanté!</em></h1>

        <p class="bio">
            Me chamo <strong>Alexandre</strong>. Sou estudante, atualmente estagiando como <strong>Desenvolvedor Front-end</strong> e me preparando para ser um futuro <strong>Cientista de Dados</strong>.
        </p>

        <div class="skills">
            <span class="skill-tag">Front-end</span>
            <span class="skill-tag">Data Science</span>
            <span class="skill-tag">Estudos</span>
        </div>

        <nav class="links">
            <a href="https://www.linkedin.com/in/alexandrelimaandre/" target="_blank" class="link-btn">LinkedIn <span>↗</span></a>
            <a href="https://github.com/Alexlimaandre" target="_blank" class="link-btn">GitHub <span>↗</span></a>
        </nav>

        <a href="{% url 'todo_list' %}" class="todo-btn">
            <span>Ver Lista de Tarefas</span>
            <span class="arrow">→</span>
        </a>
    </main>

</body>
</html>
